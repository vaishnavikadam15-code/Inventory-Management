<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BotBruz Inventory Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 50px 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        
        .logo-section {
            margin-bottom: 40px;
        }
        
        .logo-icon {
            font-size: 4rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text; /* Add this line */
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        
        .brand-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #2c3e50, #3498db);
            -webkit-background-clip: text;
            background-clip: text; /* Add this line */
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .brand-subtitle {
            color: #6c757d;
            font-size: 1rem;
            font-weight: 500;
        }
        
        .form-control-modern {
            border: 2px solid #e8ecef;
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 16px;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .form-control-modern:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            transform: translateY(-2px);
        }
        
        .input-group-modern {
            position: relative;
            margin-bottom: 25px;
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            z-index: 10;
        }
        
        .form-control-with-icon {
            padding-left: 50px;
        }
        
        .btn-login {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            padding: 15px 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 20px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            color: white;
        }
        
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .alert-modern {
            border: none;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            animation: slideInDown 0.5s ease;
        }
        
        .demo-credentials {
            background: rgba(52, 152, 219, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            border-left: 4px solid #3498db;
        }
        
        .demo-credentials h6 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .demo-credentials code {
            background: rgba(52, 152, 219, 0.2);
            color: #2c3e50;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        
        .loading-spinner {
            display: none;
        }
        
        @keyframes slideInDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse-animation {
            animation: pulse 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <i class="fas fa-microchip logo-icon"></i>
            <h1 class="brand-title">BotBruz</h1>
            <p class="brand-subtitle">Inventory Management System</p>
        </div>
        
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-modern alert-dismissible fade show">
                        <i class="fas fa-{{ 'exclamation-circle' if category == 'error' else 'info-circle' if category == 'info' else 'check-circle' }} me-2"></i>
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" id="loginForm">
            <div class="input-group-modern">
                <i class="fas fa-user input-icon"></i>
                <input type="text" name="username" class="form-control form-control-modern form-control-with-icon" 
                       placeholder="Username" required autocomplete="username">
            </div>
            
            <div class="input-group-modern">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" name="password" class="form-control form-control-modern form-control-with-icon" 
                       placeholder="Password" required autocomplete="current-password">
                <button type="button" class="btn btn-link position-absolute" 
                        style="right: 15px; top: 50%; transform: translateY(-50%); z-index: 10; border: none; background: none; color: #6c757d;" 
                        onclick="togglePassword()" id="passwordToggle">
                    <i class="fas fa-eye" id="passwordIcon"></i>
                </button>
            </div>
            
            <button type="submit" class="btn btn-login" id="loginButton">
                <span class="login-text">
                    <i class="fas fa-sign-in-alt me-2"></i>
                    Sign In
                </span>
                <span class="loading-spinner">
                    <i class="fas fa-spinner fa-spin me-2"></i>
                    Signing In...
                </span>
            </button>
        </form>
        
        <div class="demo-credentials">
            <h6><i class="fas fa-info-circle me-2"></i>Demo Credentials</h6>
            <p class="mb-1">Username: <code>admin</code></p>
            <p class="mb-0">Password: <code>admin123</code></p>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const passwordInput = document.querySelector('input[name="password"]');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.classList.remove('fa-eye');
                passwordIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                passwordIcon.classList.remove('fa-eye-slash');
                passwordIcon.classList.add('fa-eye');
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const loginButton = document.getElementById('loginButton');
            const loginText = loginButton.querySelector('.login-text');
            const loadingSpinner = loginButton.querySelector('.loading-spinner');
            
            loginText.style.display = 'none';
            loadingSpinner.style.display = 'inline';
            loginButton.disabled = true;
            
            // Add pulse animation to container
            document.querySelector('.login-container').classList.add('pulse-animation');
        });
        
        // Auto-fill demo credentials on double-click
        document.querySelector('.demo-credentials').addEventListener('dblclick', function() {
            document.querySelector('input[name="username"]').value = 'admin';
            document.querySelector('input[name="password"]').value = 'admin123';
            
            // Add visual feedback
            this.style.background = 'rgba(39, 174, 96, 0.1)';
            this.style.borderLeftColor = '#27ae60';
            
            setTimeout(() => {
                this.style.background = 'rgba(52, 152, 219, 0.1)';
                this.style.borderLeftColor = '#3498db';
            }, 1000);
        });
        
        // Focus first input on page load
        window.addEventListener('load', function() {
            document.querySelector('input[name="username"]').focus();
        });
        
        // Handle enter key navigation
        document.querySelector('input[name="username"]').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('input[name="password"]').focus();
            }
        });
    </script>
</body>
</html>
