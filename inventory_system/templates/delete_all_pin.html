{% extends "base.html" %}
{% block title %}Delete All Components{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="card shadow-sm p-3" style="max-width: 400px; margin: auto;">
    <h4 class="text-center mb-3">Enter PIN to Delete All Components</h4>
    <form method="POST">
      <div class="mb-3">
        <input type="password" class="form-control" name="pin" placeholder="Enter PIN" required>
      </div>
      <div class="d-flex justify-content-between">
        <a href="{{ url_for('inventory') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete All</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
