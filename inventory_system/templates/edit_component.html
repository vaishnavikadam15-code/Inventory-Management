{% extends "base.html" %}

{% block title %}Edit Component - BotBruz Inventory{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Component</h2>
    <div class="card">
        <div class="card-body">
            <form method="POST" action="{{ url_for('edit_component', component_id=component['id']) }}">
                
                <!-- Component Name -->
                <div class="mb-3">
                    <label for="component_name" class="form-label">Component Name</label>
                    <input type="text" class="form-control" id="component_name" name="component_name" 
                           value="{{ component['name'] }}" required>
                </div>

                <!-- Quantity -->
                <div class="mb-3">
                    <label for="quantity" class="form-label">Quantity</label>
                    <input type="number" class="form-control" id="quantity" name="quantity" 
                           value="{{ component['quantity'] }}" required>
                </div>

                <!-- Unit Price -->
                <div class="mb-3">
                    <label for="unit_price" class="form-label">Unit Price</label>
                    <input type="number" step="0.01" class="form-control" id="unit_price" name="unit_price" 
                           value="{{ component['unit_price'] }}" required>
                </div>

                <!-- Discount -->
                <div class="mb-3">
                    <label for="discount" class="form-label">Discount (₹)</label>
                    <input type="number" step="0.01" class="form-control" id="discount" name="discount" 
                           value="{{ component['discount'] or 0 }}" placeholder="Enter discount amount">
                    <small class="text-muted">When you enter a discount, unit price will update automatically.</small>
                </div>

                <!-- Buttons -->
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('inventory') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

<!-- Script to auto-update price when discount is entered -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const discountInput = document.getElementById('discount');
        const unitPriceInput = document.getElementById('unit_price');
        const originalPrice = parseFloat(unitPriceInput.value) || 0;

        discountInput.addEventListener('input', function() {
            const discount = parseFloat(discountInput.value) || 0;
            const newPrice = Math.max(originalPrice - discount, 0); // Avoid negative price
            unitPriceInput.value = newPrice.toFixed(2);
        });
    });
</script>
{% endblock %}
